name: Update profile cards

"on":
  schedule:
    - cron: "23 1 * * *" # daily, ~06:53 IST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/**]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
